name: Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Tinymist Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            vendor/tinymist/target
          key: ${{ runner.os }}-tinymist-rust-${{ hashFiles('vendor/tinymist/Cargo.lock', 'vendor/tinymist/**/*.toml', 'vendor/tinymist/crates/tinymist/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-tinymist-rust-

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build Tinymist WASM package
        run: npm run tinymist:build

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run pages:build
        env:
          GITHUB_PAGES: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
